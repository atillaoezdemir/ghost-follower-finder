<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fanın sanıp yalnız bıraktıkların</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f5;
      --card: #fff;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --drop: #eff6ff;
      --drop-border: #93c5fd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --card: #18181b;
        --text: #fafafa;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --drop: #172554;
        --drop-border: #3b82f6;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }

    .lang-switch {
      display: flex;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .lang-switch button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .lang-switch button.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 0.5rem;
      line-height: 1.25;
    }

    .tagline {
      color: var(--muted);
      margin: 0 0 1.5rem;
      font-size: 0.95rem;
    }

    .howto {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.15rem;
      margin-bottom: 1.25rem;
      font-size: 0.92rem;
    }

    .howto h2 {
      margin: 0 0 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .howto ol {
      margin: 0;
      padding-left: 1.2rem;
    }

    .howto li {
      margin-bottom: 0.4rem;
    }

    .howto li:last-child {
      margin-bottom: 0;
    }

    .howto a {
      color: var(--accent);
    }

    .howto code {
      font-family: ui-monospace, monospace;
      font-size: 0.88em;
    }

    .dropzone {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem 0.75rem;
      background: var(--drop);
      border: 1px dashed var(--drop-border);
      border-radius: 10px;
      padding: 0.75rem 0.85rem;
      transition: border-color 0.15s, background 0.15s;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--card);
    }

    .formats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      flex: 1 1 auto;
      min-width: 0;
    }

    .formats span {
      font-size: 0.78rem;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }

    .file-input-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    button.pick {
      appearance: none;
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font: inherit;
      font-size: 0.88rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border: none;
      flex-shrink: 0;
    }

    button.pick:hover {
      background: var(--accent-hover);
    }

    #upload-panel .status {
      margin-top: 0.5rem;
    }

    button.linkish {
      appearance: none;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
      font-size: 0.88rem;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    .status {
      font-size: 0.88rem;
      color: var(--muted);
      min-height: 1.25em;
    }

    .status.error { color: #dc2626; }

    .status code {
      font-family: ui-monospace, monospace;
      font-size: 0.92em;
    }

    .hidden { display: none; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 0.75rem;
    }

    .toolbar input[type="search"] {
      flex: 1 1 12rem;
      min-width: 0;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: var(--card);
      color: var(--text);
    }

    .count {
      font-size: 0.9rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th, td {
      text-align: left;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--muted);
    }

    tr:last-child td { border-bottom: none; }

    td a {
      color: var(--accent);
      word-break: break-all;
    }

    .empty {
      padding: 1.25rem;
      color: var(--muted);
      text-align: center;
    }

    #result-heading {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .dismiss-cell {
      padding: 0.35rem 0.6rem;
      text-align: right;
      width: 1%;
      white-space: nowrap;
    }

    .dismiss-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      padding: 0.18rem 0.55rem;
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .dismiss-btn:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #dc2626;
    }

    @media (prefers-color-scheme: dark) {
      .dismiss-btn:hover {
        background: #3f1515;
        border-color: #7f1d1d;
        color: #f87171;
      }
    }

    .hint-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.2em;
      height: 1.2em;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      opacity: 0.35;
      cursor: default;
      position: relative;
      user-select: none;
      transition: opacity 0.15s;
      vertical-align: middle;
    }

    .hint-icon:hover,
    .hint-icon:focus {
      opacity: 0.85;
      outline: none;
    }

    .hint-icon .tooltip {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 0.4rem);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: normal;
      width: 230px;
      z-index: 200;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      font-weight: 400;
      line-height: 1.45;
      text-align: left;
      pointer-events: none;
    }

    .hint-icon:hover .tooltip,
    .hint-icon:focus .tooltip {
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="lang-switch" role="group" aria-label="language">
        <button type="button" data-lang="tr">TR</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </div>

    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>

    <section class="howto" id="howto">
      <h2 id="howto-title"></h2>
      <ol>
        <li id="step-1"></li>
        <li id="step-2"></li>
        <li id="step-3"></li>
      </ol>
    </section>

    <section id="upload-panel">
      <div class="dropzone" id="dropzone">
        <input
          class="file-input-hidden"
          type="file"
          id="upload-input"
          multiple
          accept=".zip,.json,application/zip,application/json"
        >
        <div class="formats" aria-hidden="true">
          <span>.zip</span>
          <span>followers_1.json</span>
          <span>following.json</span>
        </div>
        <button type="button" class="pick" id="btn-upload"></button>
      </div>
      <p class="status" id="status"></p>
    </section>

    <section id="results" class="hidden">
      <div class="toolbar">
        <input type="search" id="filter" autocomplete="off">
        <span class="count" id="result-count"></span>
        <button type="button" class="linkish" id="btn-reupload"></button>
      </div>
      <p id="result-heading"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th id="col-username"></th>
              <th id="col-profile"></th>
              <th id="col-dismiss" style="text-align:right"><span class="hint-icon" tabindex="0" role="img">?<span class="tooltip" id="hint-tooltip"></span></span></th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
        <p class="empty hidden" id="no-rows"></p>
      </div>
    </section>

    <footer id="footer"></footer>
  </main>

  <script>
    const DYI_URL = "https://accountscenter.instagram.com/info_and_permissions/dyi/";

    const I18N = {

        errGeneric: "bir şeyler ters gitti",
        errZip: "zip dosyası okunamadı",
        errDecompress: "zip içeriği açılamadı",
        errRead: 'dosya okunamadı: "{name}"',
        errParse: 'geçersiz json: "{name}"',
        errNotFound:
          "eksik dosya — bulunan: {found}. <code>following.json</code> (veya <code>following_1.json</code>) ve en az bir <code>followers_*.json</code> gerekli",
        errNotFoundNone: "hiçbiri",
        errFollowingFormat: "<code>following.json</code> geçerli bir export gibi görünmüyor",
        errFollowersFormat:
          "<code>followers_1.json</code> okunamadı — tüm <code>followers_*.json</code> dosyalarını veya <code>.zip</code> yükle",
        resultEmpty: "herkes seni geri takip ediyor — kimsenin fanı değilsin, temiz kaçmışsın",

        countOf: "{n} / {total}",

        dismissBtnTitle: "bu hesabı tarayıcıya kaydet ve bir daha gösterme",
        hintText: "Bir profile tıklayıp bu sekmeye geri döndüğünde o satırda buton belirir — basınca hesap tarayıcında kalıcı olarak saklanır ve yeni listelemelerde bir daha gösterilmez.",
      },
      en: {
        pageTitle: "find who made you their fan",
        title: "find who made you their fan",
        tagline:
          "find accounts of creatures, too feeble to follow you back — no login, data only in your browser",
        howtoTitle: "how to use",
        step1:
          'instagram → <a href="' +
          DYI_URL +
          '" target="_blank" rel="noopener noreferrer">accounts center</a> → <strong>export your information</strong> → choose <strong>JSON</strong> format → select followers and following',
        step2:
          "either upload the <code>.zip</code> as-is, or upload directly <code>followers_1.json</code> and <code>following.json</code>",
        step3:
          "lists accounts you follow, who do not follow you back — the fakes will appear one by one",
        upload: "upload",
        uploadAria: "upload instagram export",
        searchPlaceholder: "search usernames",
        reupload: "upload again",
        colUsername: "username",
        colProfile: "profile",
        footer: "single html file — works offline",
        reading: "reading…",
        errEmpty:
          "nothing found — try the <code>.zip</code> or <code>followers_1.json</code> + <code>following.json</code>",
        errGeneric: "something went wrong",
        errZip: "could not read the zip file",
        errDecompress: "could not decompress zip entry",
        errRead: 'could not read "{name}"',
        errParse: 'invalid json: "{name}"',
        errNotFound:
          "missing files — found: {found}. need <code>following.json</code> (or <code>following_1.json</code>) and at least one <code>followers_*.json</code>",
        errNotFoundNone: "none",
        errFollowingFormat: "<code>following.json</code> does not look like a valid export",
        errFollowersFormat:
          "could not read <code>followers_1.json</code> — upload all <code>followers_*.json</code> files or the <code>.zip</code>",
        resultEmpty: "everyone follows you back — you're nobody's fan, clean list",
        resultHeading: "accounts that made you their fan — no follow back",
        noMatch: "no matches",
        countOf: "{n} of {total}",
        dismissBtn: "hide",
        dismissBtnTitle: "save this account in your browser and never show it again",
        hintText: "After opening a profile and coming back to this tab, a button appears on that row — press it to permanently save the account in your browser and exclude it from future lists.",
      },
      de: {
        pageTitle: "finde, wer dich zu ihrem fan gemacht hat",
        title: "finde, wer dich zu ihrem fan gemacht hat",
        tagline:
          "finde accounts von kreaturen, die zu unfähig sind, dir zurückzufolgen – kein login, daten nur in deinem browser",
        howtoTitle: "anleitung",
        step1:
          'instagram → <a href="' +
          DYI_URL +
          '" target="_blank" rel="noopener noreferrer">accounts center</a> → <strong>informationen exportieren</strong> (export your information) → format <strong>JSON</strong> → followers und following auswählen',
        step2:
          "entweder die <code>.zip</code> direkt hochladen oder direkt <code>followers_1.json</code> und <code>following.json</code>",
        step3:
          "listet konten, denen du folgst, die dir nicht zurückfolgen — die fakes kommen nacheinander ans licht",
        upload: "hochladen",
        uploadAria: "instagram export hochladen",
        searchPlaceholder: "nutzer suchen",
        reupload: "erneut hochladen",
        colUsername: "nutzername",
        colProfile: "profil",
        footer: "eine html-datei — funktioniert offline",
        reading: "wird gelesen…",
        errEmpty:
          "nichts gefunden — <code>.zip</code> oder <code>followers_1.json</code> + <code>following.json</code> versuchen",
        errGeneric: "etwas ist schiefgelaufen",
        errZip: "zip-datei konnte nicht gelesen werden",
        errDecompress: "zip-eintrag konnte nicht entpackt werden",
        errRead: 'datei konnte nicht gelesen werden: "{name}"',
        errParse: 'ungültiges json: "{name}"',
        errNotFound:
          "dateien fehlen — gefunden: {found}. <code>following.json</code> (oder <code>following_1.json</code>) und mindestens eine <code>followers_*.json</code> nötig",
        errNotFoundNone: "keine",
        errFollowingFormat: "<code>following.json</code> sieht nicht wie ein gültiger export aus",
        errFollowersFormat:
          "<code>followers_1.json</code> nicht lesbar — alle <code>followers_*.json</code> oder die <code>.zip</code> hochladen",
        resultEmpty: "alle folgen dir zurück — du bist niemandes fan, saubere liste",
        resultHeading: "konten, die dich zu ihrem fan gemacht haben — kein zurückfolgen",
        noMatch: "keine treffer",
        countOf: "{n} von {total}",
        dismissBtn: "ausblenden",
        dismissBtnTitle: "dieses konto im browser speichern und nie wieder anzeigen",
        hintText: "Wenn du ein Profil öffnest und zu diesem Tab zurückkommst, erscheint in der Zeile ein Button — drücke ihn, um das Konto dauerhaft zu speichern und aus künftigen Listen zu entfernen.",
      },
    };

    const dropzone = document.getElementById("dropzone");
    const uploadInput = document.getElementById("upload-input");
    const uploadPanel = document.getElementById("upload-panel");
    const statusEl = document.getElementById("status");
    const resultsSection = document.getElementById("results");
    const resultHeading = document.getElementById("result-heading");
    const resultsBody = document.getElementById("results-body");
    const resultCount = document.getElementById("result-count");
    const filterInput = document.getElementById("filter");
    const noRows = document.getElementById("no-rows");
    const resultsTable = document.querySelector("#results table");

    let lang = "tr";
    let allRows = [];
    const accumulatedTextMap = new Map();
    const DISMISSED_KEY = "ig-dismissed";
    let dismissedSet = new Set();
    try { dismissedSet = new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY) || "[]")); } catch (_) {}
    let lastClickedUsername = null;

    function t(key, vars) {
      let text = I18N[lang][key] || I18N.en[key] || key;
      if (vars) {
        for (const [name, value] of Object.entries(vars)) {
          text = text.replace("{" + name + "}", value);
        }
      }
      return text;
    }

    function detectLang() {
      const saved = localStorage.getItem("ig-fan-lang");
      if (saved && I18N[saved]) {
        return saved;
      }
      const browser = (navigator.language || "en").slice(0, 2).toLowerCase();
      if (I18N[browser]) {
        return browser;
      }
      return "en";
    }

    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t("pageTitle");
      document.getElementById("title").textContent = t("title");
      document.getElementById("tagline").textContent = t("tagline");
      document.getElementById("howto-title").textContent = t("howtoTitle");
      document.getElementById("step-1").innerHTML = t("step1");
      document.getElementById("step-2").innerHTML = t("step2");
      document.getElementById("step-3").textContent = t("step3");
      document.getElementById("btn-upload").textContent = t("upload");
      dropzone.setAttribute("aria-label", t("uploadAria"));
      filterInput.placeholder = t("searchPlaceholder");
      document.getElementById("btn-reupload").textContent = t("reupload");
      document.getElementById("col-username").textContent = t("colUsername");
      document.getElementById("col-profile").textContent = t("colProfile");
      document.getElementById("footer").textContent = t("footer");
      noRows.textContent = t("noMatch");
      document.getElementById("hint-tooltip").textContent = t("hintText");

      document.querySelectorAll(".lang-switch button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      if (allRows.length) {
        if (resultsTable.classList.contains("hidden")) {
          resultHeading.textContent = t("resultEmpty");
        } else {
          resultHeading.textContent = t("resultHeading");
        }
        applyFilter();
      }
    }

    function setLang(code) {
      lang = code;
      localStorage.setItem("ig-fan-lang", code);
      applyLang();
    }

    function profileUrl(username) {
      return "https://www.instagram.com/" + encodeURIComponent(username) + "/";
    }

    function normalizePath(path) {
      return path.replace(/\\/g, "/").replace(/^\/+/, "");
    }

    function pathBase(path) {
      const parts = normalizePath(path).split("/");
      return parts[parts.length - 1].toLowerCase();
    }

    function pathScore(path) {
      const p = normalizePath(path).toLowerCase();
      let score = 0;
      if (p.includes("followers_and_following/")) score += 4;
      if (p.includes("connections/")) score += 2;
      if (p.startsWith("followers_and_following/")) score += 1;
      return score;
    }

    function isZipFile(name) {
      return name.toLowerCase().endsWith(".zip");
    }

    function isAllowedJsonBase(base) {
      const b = base.toLowerCase();
      return (
        (b.startsWith("following") && b.endsWith(".json")) ||
        (b.startsWith("followers") && b.endsWith(".json"))
      );
    }

    function isAllowedJsonUpload(name) {
      return isAllowedJsonBase(pathBase(name));
    }

    function isAllowedZipJsonPath(path) {
      return isAllowedJsonBase(pathBase(path));
    }

    function relationshipEntries(data, key) {
      if (Array.isArray(data)) {
        return data;
      }
      if (data && typeof data === "object") {
        if (Array.isArray(data[key])) {
          return data[key];
        }
        for (const value of Object.values(data)) {
          if (Array.isArray(value) && value.length) {
            const first = value[0];
            if (first && (first.string_list_data || first.title !== undefined)) {
              return value;
            }
          }
        }
      }
      return [];
    }

    function usernameFromRelationshipItem(item) {
      for (const entry of item.string_list_data || []) {
        if (entry.value) {
          return String(entry.value).trim();
        }
        if (entry.href) {
          const slug = entry.href
            .replace(/\/+$/, "")
            .split("/")
            .filter(Boolean)
            .pop();
          if (slug) {
            return slug;
          }
        }
      }
      const title = item.title != null ? String(item.title).trim() : "";
      return title || null;
    }

    async function inflateDeflate(data) {
      for (const format of ["deflate", "deflate-raw"]) {
        try {
          const out = new Blob([data]).stream().pipeThrough(new DecompressionStream(format));
          const ab = await new Response(out).arrayBuffer();
          return new Uint8Array(ab);
        } catch {
          /* try next format */
        }
      }
      throw new Error(t("errDecompress"));
    }

    async function unzipToTextMap(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      const bytes = new Uint8Array(arrayBuffer);
      const textMap = new Map();
      const decoder = new TextDecoder();

      let eocd = -1;
      for (let i = bytes.length - 22; i >= 0; i--) {
        if (view.getUint32(i, true) === 0x06054b50) {
          eocd = i;
          break;
        }
      }
      if (eocd < 0) {
        throw new Error(t("errZip"));
      }

      const totalEntries = view.getUint16(eocd + 10, true);
      let offset = view.getUint32(eocd + 16, true);

      for (let n = 0; n < totalEntries; n++) {
        if (view.getUint32(offset, true) !== 0x02014b50) {
          break;
        }

        const compression = view.getUint16(offset + 10, true);
        const compressedSize = view.getUint32(offset + 20, true);
        const nameLen = view.getUint16(offset + 28, true);
        const extraLen = view.getUint16(offset + 30, true);
        const commentLen = view.getUint16(offset + 32, true);
        const localHeaderOffset = view.getUint32(offset + 42, true);
        const name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLen));
        offset += 46 + nameLen + extraLen + commentLen;

        if (name.endsWith("/") || !isAllowedZipJsonPath(name)) {
          continue;
        }

        const localOffset = localHeaderOffset;
        const localNameLen = view.getUint16(localOffset + 26, true);
        const localExtraLen = view.getUint16(localOffset + 28, true);
        const dataStart = localOffset + 30 + localNameLen + localExtraLen;
        const compressed = bytes.subarray(dataStart, dataStart + compressedSize);

        let raw;
        if (compression === 0) {
          raw = compressed;
        } else if (compression === 8) {
          raw = await inflateDeflate(compressed);
        } else {
          continue;
        }

        textMap.set(normalizePath(name), decoder.decode(raw));
      }

      return textMap;
    }

    async function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(t("errRead", { name: file.name })));
        reader.readAsText(file);
      });
    }

    async function collectFromFiles(fileList) {
      const textMap = new Map();

      for (const file of fileList) {
        const name = file.name;
        if (isZipFile(name)) {
          const nested = await unzipToTextMap(await file.arrayBuffer());
          for (const [path, text] of nested) {
            textMap.set(path, text);
          }
          continue;
        }
        textMap.set(pathBase(name), await readFileAsText(file));
      }

      return textMap;
    }

    function pickInstagramPaths(textMap) {
      const paths = [...textMap.keys()];
      const followingCandidates = [];
      const followerCandidates = [];

      for (const path of paths) {
        const base = pathBase(path);
        if (base.includes("following") && base.endsWith(".json")) {
          followingCandidates.push(path);
        } else if (base.includes("followers") && base.endsWith(".json")) {
          followerCandidates.push(path);
        }
      }

      followingCandidates.sort((a, b) => pathScore(b) - pathScore(a));
      followerCandidates.sort((a, b) => {
        const scoreDiff = pathScore(b) - pathScore(a);
        if (scoreDiff !== 0) {
          return scoreDiff;
        }
        return a.localeCompare(b, undefined, { numeric: true });
      });

      return {
        followingPath: followingCandidates[0] || null,
        followerPaths: followerCandidates,
      };
    }

    function parseJson(text, label) {
      try {
        return JSON.parse(text);
      } catch {
        throw new Error(t("errParse", { name: label }));
      }
    }

    function mergeFollowers(datasets) {
      const followers = new Set();
      for (const data of datasets) {
        for (const item of relationshipEntries(data, "relationships_followers")) {
          const username = usernameFromRelationshipItem(item);
          if (username) {
            followers.add(username.toLowerCase());
          }
        }
      }
      return followers;
    }

    function loadFollowing(data) {
      const following = [];
      for (const item of relationshipEntries(data, "relationships_following")) {
        const username = usernameFromRelationshipItem(item);
        if (!username) {
          continue;
        }
        const href = item.string_list_data?.[0]?.href || profileUrl(username);
        following.push({ username, href });
      }
      return following;
    }

    function compare(followersSet, followingList) {
      return followingList
        .filter(({ username }) => !followersSet.has(username.toLowerCase()) && !dismissedSet.has(username.toLowerCase()))
        .sort((a, b) => a.username.localeCompare(b.username, undefined, { sensitivity: "base" }));
    }

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", Boolean(isError));
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/'/g, "&#39;");
    }

    function applyFilter() {
      const query = filterInput.value.trim().toLowerCase();
      const filtered = query
        ? allRows.filter((row) => row.username.toLowerCase().includes(query))
        : allRows;

      const pendingLower = lastClickedUsername ? lastClickedUsername.toLowerCase() : null;
      resultsBody.innerHTML = filtered
        .map((row) => {
          const u = escapeHtml(row.username);
          const uAttr = escapeAttr(row.username);
          const href = escapeAttr(row.href);
          const isPending = pendingLower && pendingLower === row.username.toLowerCase();
          const btnHidden = isPending ? "" : " hidden";
          return (
            `<tr data-username="${uAttr}">` +
            `<td>${u}</td>` +
            `<td><a href="${href}" target="_blank" rel="noopener noreferrer">${escapeHtml(profileUrl(row.username))}</a></td>` +
            `<td class="dismiss-cell"><button class="dismiss-btn${btnHidden}" data-username="${uAttr}" title="${escapeAttr(t("dismissBtnTitle"))}">${escapeHtml(t("dismissBtn"))}</button></td>` +
            `</tr>`
          );
        })
        .join("");

      if (allRows.length === 0) {
        resultCount.textContent = "";
        return;
      }

      resultCount.textContent = t("countOf", {
        n: String(filtered.length),
        total: String(allRows.length),
      });
      if (!resultsTable.classList.contains("hidden")) {
        noRows.classList.toggle("hidden", filtered.length > 0);
      }
    }

    function showDismissButton(username) {
      const lower = username.toLowerCase();
      for (const tr of resultsBody.querySelectorAll("tr[data-username]")) {
        if (tr.dataset.username.toLowerCase() === lower) {
          const btn = tr.querySelector(".dismiss-btn");
          if (btn) btn.classList.remove("hidden");
          break;
        }
      }
    }

    function dismiss(username) {
      dismissedSet.add(username.toLowerCase());
      try {
        localStorage.setItem(DISMISSED_KEY, JSON.stringify([...dismissedSet]));
      } catch (_) {}
      if (lastClickedUsername && lastClickedUsername.toLowerCase() === username.toLowerCase()) {
        lastClickedUsername = null;
      }
      allRows = allRows.filter((r) => r.username.toLowerCase() !== username.toLowerCase());
      applyFilter();
    }

    function showResults(rows) {
      allRows = rows.map((row) => ({
        username: row.username,
        href: row.href.startsWith("http") ? row.href : profileUrl(row.username),
      }));

      filterInput.value = "";
      resultsSection.classList.remove("hidden");

      if (allRows.length === 0) {
        resultHeading.textContent = t("resultEmpty");
        resultsBody.innerHTML = "";
        resultsTable.classList.add("hidden");
        noRows.classList.add("hidden");
        resultCount.textContent = "";
      } else {
        resultHeading.textContent = t("resultHeading");
        resultsTable.classList.remove("hidden");
        noRows.textContent = t("noMatch");
        applyFilter();
      }

      setStatus("", false);
      uploadPanel.classList.add("hidden");
    }

    async function runComparison(textMap) {
      const paths = [...textMap.keys()];
      const { followingPath, followerPaths } = pickInstagramPaths(textMap);

      if (!followingPath || !followerPaths.length) {
        const found = paths.map(pathBase);
        throw new Error(
          t("errNotFound", {
            found: found.length ? found.join(", ") : t("errNotFoundNone"),
          })
        );
      }

      const followingData = parseJson(textMap.get(followingPath), pathBase(followingPath));
      const followingList = loadFollowing(followingData);
      if (!followingList.length) {
        throw new Error(t("errFollowingFormat"));
      }

      const followerDatasets = followerPaths.map((path) =>
        parseJson(textMap.get(path), pathBase(path))
      );
      const followersSet = mergeFollowers(followerDatasets);
      if (!followersSet.size) {
        throw new Error(t("errFollowersFormat"));
      }

      const rows = compare(followersSet, followingList);
      showResults(rows);
    }

    async function ingest(source) {
      setStatus(t("reading"), false);
      resultsSection.classList.add("hidden");

      try {
        const textMap = await source();
        if (!textMap.size) {
          if (!accumulatedTextMap.size) {
            statusEl.innerHTML = t("errEmpty");
            statusEl.classList.add("error");
          }
          return;
        }

        // Merge newly uploaded files into accumulated map
        for (const [path, text] of textMap) {
          accumulatedTextMap.set(path, text);
        }

        await runComparison(accumulatedTextMap);
      } catch (err) {
        const loadedList = [...accumulatedTextMap.keys()].join(", ") || "yok";
        let errMsg = err.message || t("errGeneric");
        if (errMsg.includes("<code>")) {
          statusEl.innerHTML = errMsg + "<br><small style='opacity:0.8;font-size:0.8em;'>Hafızadaki dosyalar: " + loadedList + "</small>";
          statusEl.classList.add("error");
        } else {
          setStatus(errMsg + " (Hafızadaki dosyalar: " + loadedList + ")", true);
        }
      }
    }

    function resetUpload() {
      accumulatedTextMap.clear();
      allRows = [];
      uploadInput.value = "";
      filterInput.value = "";
      resultsBody.innerHTML = "";
      resultsSection.classList.add("hidden");
      uploadPanel.classList.remove("hidden");
      setStatus("", false);
    }

    document.getElementById("btn-upload").addEventListener("click", () => {
      uploadInput.click();
    });

    uploadInput.addEventListener("change", () => {
      if (!uploadInput.files.length) {
        return;
      }
      const filesCopy = Array.from(uploadInput.files);
      ingest(() => collectFromFiles(filesCopy));
      uploadInput.value = "";
    });

    dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropzone.classList.remove("dragover");
      if (event.dataTransfer.files.length) {
        const filesCopy = Array.from(event.dataTransfer.files);
        ingest(() => collectFromFiles(filesCopy));
      }
    });

    filterInput.addEventListener("input", applyFilter);
    document.getElementById("btn-reupload").addEventListener("click", resetUpload);

    resultsBody.addEventListener("click", (e) => {
      const btn = e.target.closest(".dismiss-btn");
      if (btn && btn.dataset.username) {
        dismiss(btn.dataset.username);
        return;
      }
      const link = e.target.closest("a");
      if (link) {
        const tr = link.closest("tr[data-username]");
        if (tr) lastClickedUsername = tr.dataset.username;
      }
    });

    document.querySelectorAll(".lang-switch button").forEach((btn) => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && lastClickedUsername) {
        showDismissButton(lastClickedUsername);
      }
    });

    lang = detectLang();
    applyLang();
  </script>
</body>
</html>
